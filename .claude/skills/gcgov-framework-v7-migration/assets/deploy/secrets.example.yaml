# The shape of {{SLUG}}'s Secrets. Copy to secrets.sops.yaml, fill in, then:
#
#   sops --encrypt --in-place zones/{{ZONE}}/apps/{{SLUG}}/secrets.sops.yaml
#
# Every key becomes a file at /etc/gcgov/secrets/{{SLUG}}/<key lowercased> on the host,
# mounted read-only into the container. A key containing / becomes a subdirectory, which
# is how the JWT signing keys are provisioned. Keys starting with _ are metadata, not
# Secrets, and are never written.
#
# NEVER commit this file with real values under any name but *.sops.yaml.
#
# Every value below is new. The v6 credentials sat in app/config/environment-*.json and are
# in that repository's git history, so none of them may be reused.

_owner: "IT — who to ask before rotating"
_rotated: "1970-01-01"

# A database user scoped to {{SLUG}} AND to the {{ZONE}} Zone, readWrite on {{MONGO_DATABASE}}
# only. The -g1 generation suffix lets a rotation create -g2 beside it.
# See docs/runbooks/rotate-a-secret.md.
MONGO_URI: "mongodb://{{SLUG}}-{{ZONE}}-g1:CHANGEME@{{MONGO_HOSTS}}/{{MONGO_DATABASE}}?authSource={{MONGO_AUTH_SOURCE}}&replicaSet={{MONGO_REPLICA_SET}}"

# The JWT signing keys, generated with `vendor/bin/gf cert:generate-auth`. See jwt/README.md.
#
# JWT/guids.json: |
#     [
#         "<guid>"
#     ]
# JWT/private-<guid>.pem: |
#     -----BEGIN PRIVATE KEY-----
#     CHANGEME
#     -----END PRIVATE KEY-----
# JWT/public-<guid>.pem: |
#     -----BEGIN PUBLIC KEY-----
#     CHANGEME
#     -----END PUBLIC KEY-----

{{OTHER_SECRETS}}
